{{define "dashboard_shell_start"}}
<!-- Dashboard -->
<div class="dashboard app-manager-active" id="dashboard">
  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="3" width="20" height="18" rx="3" stroke="var(--accent)" stroke-width="2"/>
          <circle cx="7" cy="8" r="1.5" fill="var(--accent)"/>
          <circle cx="7" cy="12" r="1.5" fill="var(--accent)"/>
          <circle cx="7" cy="16" r="1.5" fill="var(--accent)"/>
          <line x1="11" y1="8" x2="18" y2="8" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11" y1="12" x2="16" y2="12" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11" y1="16" x2="18" y2="16" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Server<span>Pilot</span>
      </div>
      <div class="module-switcher">
        <button class="module-switcher-trigger" id="moduleSwitcherBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="moduleSwitcherMenu">
          <img src="/static/icons/tabler/layout-grid.svg" alt="">
          <span id="moduleSwitcherLabel">Application Manager</span>
          <img class="module-switcher-chevron" src="/static/icons/tabler/chevron-down.svg" alt="">
        </button>
        <div class="module-switcher-menu" id="moduleSwitcherMenu" role="listbox" aria-label="ServerPilot modules" hidden>
          <button type="button" class="module-switcher-option active" role="option" aria-selected="true" data-module-tab="app-manager">
            <span class="module-switcher-icon module-switcher-icon-primary"><img src="/static/icons/tabler/packages.svg" alt=""></span>
            <span><strong>Application Manager</strong><small>Projects, releases, resources and deployments</small></span>
            <img class="module-switcher-check" src="/static/icons/tabler/check.svg" alt="">
          </button>
          <button type="button" class="module-switcher-option" role="option" aria-selected="false" data-module-tab="db">
            <span class="module-switcher-icon"><img src="/static/icons/tabler/database.svg" alt=""></span>
            <span><strong>Database</strong><small>Connections, queries, schema and audit</small></span>
            <img class="module-switcher-check" src="/static/icons/tabler/check.svg" alt="">
          </button>
        </div>
      </div>
    </div>
    <div class="navbar-right">
      <div class="navbar-actions-primary">
        <div class="jobs-indicator-wrap">
          <button type="button" class="btn btn-sm btn-outline jobs-indicator-btn" id="jobsIndicatorBtn" style="display:none;" aria-expanded="false" aria-controls="jobsPanel" title="Background operations">
            <span class="jobs-indicator-dot" aria-hidden="true"></span>
            <span class="jobs-indicator-label">Operations</span>
            <span class="jobs-indicator-count" id="jobsIndicatorCount" style="display:none;">0</span>
          </button>
          <div class="jobs-panel" id="jobsPanel" role="dialog" aria-label="Background operations">
            <div class="jobs-panel-header">
              <span>Background operations</span>
              <button type="button" class="jobs-panel-close" id="jobsPanelClose" aria-label="Close">&times;</button>
            </div>
            <div class="jobs-panel-list" id="jobsPanelList"></div>
            <div class="jobs-panel-note">Privileged operations finish safely before they can be dismissed.</div>
          </div>
        </div>
        <button class="btn btn-sm btn-outline" id="refreshBtn" title="Refresh current module">&#x21bb; Refresh</button>
        <button class="btn btn-sm btn-outline" id="logoutBtn">Logout</button>
      </div>
      <div class="navbar-actions-more-wrap">
        <button type="button" class="btn btn-sm btn-outline navbar-more-btn" id="navbarMoreBtn" aria-expanded="false" aria-controls="navbarSecondary" title="More actions">&#x22EE; More</button>
        <div class="navbar-actions-secondary" id="navbarSecondary">
          <div class="update-banner" id="updateBanner">
            <span class="update-version" id="updateVersionText"></span>
            <button class="btn btn-sm btn-success" id="updateBtn">Update</button>
          </div>
          <div class="update-banner" id="rollbackBanner" style="display:none;background:rgba(210,153,34,0.12);border-color:var(--yellow);">
            <span class="update-version" id="rollbackVersionText" style="color:var(--yellow);"></span>
            <button class="btn btn-sm" id="rollbackBtn" style="background:var(--yellow);color:#000;">Rollback</button>
          </div>
          <button class="btn btn-sm btn-outline" id="checkUpdatesBtn" title="Check for new versions">Check Updates</button>
          <button class="btn btn-sm btn-outline" id="navbarEditNginxMainBtn" title="Edit /etc/nginx/nginx.conf">Edit nginx.conf</button>
          <button class="btn btn-sm btn-outline" id="navbarRepairNginxBtn" title="Repair known safe Nginx issues">Repair Nginx</button>
          <button class="btn btn-sm btn-outline" id="copyPublicIpBtn" title="Copy server public IP">Copy IP</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-content">
{{end}}
