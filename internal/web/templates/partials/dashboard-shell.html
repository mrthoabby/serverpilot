{{define "dashboard_shell_start"}}
<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <nav class="navbar">
    <div class="navbar-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="3" width="20" height="18" rx="3" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="7" cy="8" r="1.5" fill="var(--accent)"/>
        <circle cx="7" cy="12" r="1.5" fill="var(--accent)"/>
        <circle cx="7" cy="16" r="1.5" fill="var(--accent)"/>
        <line x1="11" y1="8" x2="18" y2="8" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="12" x2="16" y2="12" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="11" y1="16" x2="18" y2="16" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Server<span>Pilot</span>
    </div>
    <div class="navbar-right">
      <div class="navbar-actions-primary">
        <button class="btn btn-sm btn-outline" id="refreshBtn" title="Refresh current tab">&#x21bb; Refresh</button>
        <button class="btn btn-sm btn-outline" id="logoutBtn">Logout</button>
      </div>
      <div class="navbar-actions-more-wrap">
        <button type="button" class="btn btn-sm btn-outline navbar-more-btn" id="navbarMoreBtn" aria-expanded="false" aria-controls="navbarSecondary" title="More actions">&#x22EE; Más</button>
        <div class="navbar-actions-secondary" id="navbarSecondary">
          <div class="update-banner" id="updateBanner">
            <span class="update-version" id="updateVersionText"></span>
            <button class="btn btn-sm btn-success" id="updateBtn">Update</button>
          </div>
          <div class="update-banner" id="rollbackBanner" style="display:none;background:rgba(210,153,34,0.12);border-color:var(--yellow);">
            <span class="update-version" id="rollbackVersionText" style="color:var(--yellow);"></span>
            <button class="btn btn-sm" id="rollbackBtn" style="background:var(--yellow);color:#000;">Rollback</button>
          </div>
          <button class="btn btn-sm btn-outline" id="checkUpdatesBtn" title="Check for new versions">&#x1F50D; Check Updates</button>
          <button class="btn btn-sm btn-outline" id="copyPublicIpBtn" title="Copy server public IP">&#x1F4CB; Copy IP</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="tabs tabs-scroll">
      <button class="tab-btn active" data-tab="containers">

        <span class="tab-label">Containers</span> <span class="tab-count" id="containerCount">0</span>
      </button>
      <button class="tab-btn" data-tab="images">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5A2.5 2.5 0 014.5 0h7A2.5 2.5 0 0114 2.5v10.795a4.2 4.2 0 00-.775-.14l-.217-.014H2V2.5zM2.5 14v.5A1.5 1.5 0 004 16h9.5a2.5 2.5 0 002.5-2.5v-8A2.5 2.5 0 0013.5 3H14v10.5a1.5 1.5 0 01-1.5 1.5h-10z"/></svg>

      <button class="tab-btn" data-tab="resources">

      <button class="tab-btn" data-tab="apps">

        <span class="tab-label">Apps</span>
      </button>
      <button class="tab-btn" data-tab="users">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 5a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0zm.061 3.073a4 4 0 10-5.123 0 6.004 6.004 0 00-3.431 5.142.75.75 0 001.498.07 4.5 4.5 0 018.99 0 .75.75 0 101.498-.07 6.004 6.004 0 00-3.432-5.142z"/></svg>

      <button class="tab-btn" data-tab="settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4.754a3.246 3.246 0 100 6.492 3.246 3.246 0 000-6.492zM5.754 8a2.246 2.246 0 114.492 0 2.246 2.246 0 01-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 01-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 01-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 01.52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 011.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 011.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 01.52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 01-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 01-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 002.693 1.115l.291-.16c.764-.415 1.6.422 1.184 1.185l-.159.292a1.873 1.873 0 001.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 00-1.115 2.693l.16.291c.415.764-.422 1.6-1.185 1.184l-.292-.159a1.873 1.873 0 00-2.692 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 00-2.693-1.115l-.291.16c-.764.415-1.6-.422-1.184-1.185l.159-.292A1.873 1.873 0 001.945 8.93l-.318-.094c-.835-.246-.835-1.428 0-1.674l.319-.094a1.873 1.873 0 001.115-2.693l-.16-.291c-.415-.764.422-1.6 1.185-1.184l.292.159a1.873 1.873 0 002.692-1.116l.094-.318z"/></svg>
