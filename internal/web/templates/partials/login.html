{{define "login"}}
<!-- Login Screen -->
<div class="login-wrapper" id="loginScreen">
  <div class="login-card">
    <h1>Server<span>Pilot</span></h1>
    <p class="login-subtitle">Server administration dashboard</p>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm" autocomplete="on" onsubmit="return false;">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVis('password', this)" aria-label="Mostrar contraseña" title="Mostrar contraseña">
            <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 3.5C4.136 3.5 1.04 6.008.152 7.59a.796.796 0 000 .82C1.04 9.992 4.136 12.5 8 12.5s6.96-2.508 7.848-4.09a.796.796 0 000-.82C14.96 6.008 11.864 3.5 8 3.5zM8 11a3 3 0 110-6 3 3 0 010 6z"/><circle cx="8" cy="8" r="1.5"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="mfaCode">MFA Code</label>
        <input type="text" id="mfaCode" name="mfa_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Required only if enabled">
      </div>
      <button type="submit" class="btn btn-primary login-btn" id="loginBtn">Sign In</button>
    </form>
    <div id="emailLoginBox" style="display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);">
      <button type="button" class="btn btn-secondary login-btn" id="emailLoginToggleBtn">Login by email</button>
      <div id="emailLoginPanel" style="display:none;margin-top:0.85rem;">
        <div class="form-group">
          <label for="emailLoginEmail">Email</label>
          <input type="email" id="emailLoginEmail" autocomplete="email" placeholder="admin@example.com">
        </div>
        <button type="button" class="btn btn-primary login-btn" id="emailLoginRequestBtn">Send Code</button>
        <div id="emailLoginCodeBox" style="display:none;margin-top:0.85rem;">
          <div class="form-group">
            <label for="emailLoginCode">Code</label>
            <input type="text" id="emailLoginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
          </div>
          <button type="button" class="btn btn-primary login-btn" id="emailLoginVerifyBtn">Verify Code</button>
        </div>
      </div>
    </div>
  </div>
</div>

{{end}}
