{{define "panel_app_manager"}}
<section class="tab-panel app-manager active" id="panel-app-manager" aria-label="Application Manager">
  <button class="am-mobile-menu" id="amMobileMenu" type="button" aria-controls="amSidebar" aria-expanded="false">
    <img src="/static/icons/tabler/layout-grid.svg" alt=""><span>Navigation</span>
  </button>
  <div class="am-shell">
    <aside class="am-sidebar" id="amSidebar">
      <div class="am-identity">
        <div class="am-monogram" id="amAccountMonogram" aria-hidden="true">SP</div>
        <div><strong id="amAccountName">ServerPilot</strong><span id="amAccountHandle">Application Manager</span></div>
        <button class="am-sidebar-close am-icon-button" id="amSidebarClose" type="button" aria-label="Close navigation"><img src="/static/icons/tabler/x.svg" alt=""></button>
      </div>

      <section class="am-sidebar-section open" id="amProjectsSection">
        <div class="am-sidebar-section-head">
          <button class="am-sidebar-section-toggle" id="amProjectSelector" type="button" aria-expanded="true">
            <img src="/static/icons/tabler/folder-code.svg" alt=""><strong>Projects</strong><span class="am-count" id="amProjectCount">0</span><img class="am-chevron" src="/static/icons/tabler/chevron-up.svg" alt="">
          </button>
          <button class="am-sidebar-add" type="button" data-am-action="create-project" aria-label="Create project"><img src="/static/icons/tabler/plus.svg" alt=""></button>
        </div>
        <div class="am-sidebar-submenu" id="amProjectMenu">
          <label class="am-sidebar-search"><img src="/static/icons/tabler/search.svg" alt=""><input id="amProjectSearch" type="search" placeholder="Search projects…" aria-label="Search projects"></label>
          <div class="am-selector-options" id="amProjectOptions"></div>
        </div>
      </section>

      <section class="am-sidebar-section" id="amApplicationsSection">
        <div class="am-sidebar-section-head">
          <button class="am-sidebar-section-toggle" id="amApplicationSelector" type="button" aria-expanded="false">
            <img src="/static/icons/tabler/packages.svg" alt=""><strong>Applications</strong><span class="am-count" id="amApplicationCount">0</span><img class="am-chevron" src="/static/icons/tabler/chevron-down.svg" alt="">
          </button>
        </div>
        <div class="am-sidebar-submenu" id="amApplicationMenu" hidden>
          <label class="am-sidebar-search"><img src="/static/icons/tabler/search.svg" alt=""><input id="amApplicationSearch" type="search" placeholder="Search applications…" aria-label="Search applications"></label>
          <div class="am-selector-options" id="amApplicationOptions"></div>
        </div>
      </section>

      <div class="am-sidebar-divider"></div>
      <nav class="am-nav" aria-label="Application Manager navigation">
        <button type="button" data-am-view="repositories"><img src="/static/icons/tabler/folder-code.svg" alt="">Repositories</button>
        <button type="button" data-am-view="resources"><img src="/static/icons/tabler/activity.svg" alt="">Resources</button>
        <button type="button" data-am-view="github"><img src="/static/icons/tabler/brand-github.svg" alt="">GitHub</button>
        <button type="button" data-am-view="settings"><img src="/static/icons/tabler/settings.svg" alt="">Settings</button>
      </nav>
      <div class="am-agent-summary"><span class="am-live-dot" aria-hidden="true"></span><span><strong id="amAgentSummary">Loading agents…</strong><small>All regions reporting</small></span></div>
    </aside>
    <button class="am-sidebar-backdrop" id="amSidebarBackdrop" type="button" aria-label="Close navigation"></button>
    <main class="am-main">
      <header class="am-topbar">
        <label class="am-search"><img src="/static/icons/tabler/search.svg" alt=""><input id="amGlobalSearch" type="search" placeholder="Search projects, apps, repositories…"><kbd>⌘K</kbd></label>
        <button class="am-profile" type="button" aria-label="Account menu" id="amProfileMonogram">SP</button>
      </header>
      <div class="am-content" id="amContent" aria-live="polite">
        <div class="am-skeleton am-skeleton-page" aria-label="Loading Application Manager"></div>
      </div>
      {{template "panel_resources" .}}
      {{template "panel_settings" .}}
      {{template "panel_terminal" .}}
    </main>
  </div>
  <template id="amDeploymentGuideTemplate">
    <section class="am-section" aria-labelledby="amDeploymentGuideTitle">
      <div class="am-section-head">
        <div>
          <h2 id="amDeploymentGuideTitle">How deployment works</h2>
          <div class="am-muted">Reference requirements for every application managed by ServerPilot.</div>
        </div>
      </div>
      <div class="am-guide-details">
        <details open>
          <summary>
            <span><img src="/static/icons/tabler/folder-code.svg" alt=""><span><strong>Repository and container image</strong><small>Dockerfile, build context, port and image naming</small></span></span>
            <img src="/static/icons/tabler/chevron-down.svg" alt="">
          </summary>
          <div>
            <p>Each application is linked to exactly one synchronized repository. Configure a valid Dockerfile path, build context and container port.</p>
            <p>The workflow must publish <code>ghcr.io/{owner}/sp-{repository}-{application}:{version-tag}</code>. ServerPilot resolves and deploys the immutable digest, never <code>latest</code>.</p>
          </div>
        </details>
        <details>
          <summary>
            <span><img src="/static/icons/tabler/code.svg" alt=""><span><strong>GitHub Actions workflow</strong><small>Build and publish one image per application</small></span></span>
            <img src="/static/icons/tabler/chevron-down.svg" alt="">
          </summary>
          <div>
            <p>Copy the workflow generated by ServerPilot into <code>.github/workflows/</code>. It runs for semantic version tags and uses the Dockerfile and build context configured for that application.</p>
            <p>The workflow publishes the required OCI labels and must never include runtime variables or secrets inside the image.</p>
          </div>
        </details>
        <details>
          <summary>
            <span><img src="/static/icons/tabler/layers-subtract.svg" alt=""><span><strong>Environments and runtime configuration</strong><small>Test, Staging or Production with isolated variables</small></span></span>
            <img src="/static/icons/tabler/chevron-down.svg" alt="">
          </summary>
          <div>
            <p>Every application needs at least one environment. Each environment selects its server, domain, Nginx and SSL options, health check and automatic deployment policy.</p>
            <p>At deploy time ServerPilot loads project variables first and environment variables second, so the environment overwrites duplicate keys. Secrets stay encrypted and are resolved only in memory.</p>
          </div>
        </details>
        <details>
          <summary>
            <span><img src="/static/icons/tabler/rocket.svg" alt=""><span><strong>Version, deployment and rollback</strong><small>Release detection, health checks and safe activation</small></span></span>
            <img src="/static/icons/tabler/chevron-down.svg" alt="">
          </summary>
          <div>
            <p>A repository version is shared by every linked application, while each application has its own image artifact. ServerPilot waits for GHCR to return the image digest before deploying.</p>
            <p>Deployments can be manual, triggered by a semantic version tag, or triggered by a published GitHub Release. ServerPilot verifies health, uses blue-green switching when Nginx is enabled, and rolls back to a previously successful digest.</p>
          </div>
        </details>
      </div>
    </section>
  </template>
  <dialog class="am-dialog" id="amDialog" aria-labelledby="amDialogTitle">
    <form method="dialog" class="am-dialog-frame" id="amDialogFrame">
      <header><div><span class="am-eyebrow" id="amDialogEyebrow">Application Manager</span><h2 id="amDialogTitle">Dialog</h2></div><button value="cancel" class="am-icon-button" aria-label="Close"><img src="/static/icons/tabler/x.svg" alt=""></button></header>
      <div class="am-dialog-body" id="amDialogBody"></div>
      <footer id="amDialogFooter"></footer>
    </form>
  </dialog>
</section>
{{end}}
