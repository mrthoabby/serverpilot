services:
  web:
    build: .
    ports:
      - "${SP_COMPOSE_PORT}:8080"
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
  api:
    image: nginx:alpine
    expose:
      - "80"
  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
